baseURL = 'https://seasealji.github.io/'
locale = 'zh-CN'
title = '非洲鸡的小窝'
defaultContentLanguage = 'zh'
enableRobotsTXT = true
summaryLength = 96

[pagination]
  pagerSize = 9

[taxonomies]
  category = 'categories'
  tag = 'tags'

[permalinks]
  posts = '/posts/:slug/'

[params]
  description = '记录技术实践、美剧电影、生活、项目与个人思考。'
  author = 'SeaSealji'
  subtitle = '在代码、光影与日常之间，留下一些认真生活的证据。'

[markup.goldmark.renderer]
  unsafe = true

[caches]
  [caches.images]
    dir = ':cacheDir/images'

