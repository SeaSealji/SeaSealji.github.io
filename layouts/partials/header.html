<header class="site-header">
  <div class="shell header-inner">
    <a class="brand" href="{{ site.Home.RelPermalink }}" aria-label="{{ site.Title }}首页">
      <span class="brand-mark" aria-hidden="true">非</span>
      <span class="brand-text">{{ site.Title }}</span>
    </a>
    <nav class="main-nav" aria-label="主导航">
      {{ range site.Menus.main }}
      {{ if .HasChildren }}
        <details class="nav-dropdown nav-dropdown-{{ .Identifier }}{{ if or ($.IsMenuCurrent "main" .) ($.HasMenuCurrent "main" .) (and (eq .Identifier "recommendations") (eq $.Section "recommendations")) }} is-current{{ end }}">
          <summary>{{ .Name }}<svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4 6 4 4 4-4"/></svg></summary>
          <div class="nav-submenu">
            {{ range .Children }}
            <a href="{{ .URL }}" aria-label="{{ .Name }}" {{ if $.IsMenuCurrent "main" . }}aria-current="page"{{ end }}>
              <span class="nav-submenu-icon {{ .Identifier }}-icon" aria-hidden="true">
                {{ if eq .Identifier "about-me" }}<svg viewBox="0 0 20 20"><circle cx="10" cy="7" r="3"/><path d="M4.5 16c.6-3 2.4-4.5 5.5-4.5s4.9 1.5 5.5 4.5"/></svg>{{ else if eq .Identifier "music" }}<svg viewBox="0 0 20 20"><path d="M8 15.2a2.7 2.7 0 1 1-2-2.6c.8 0 1.5.3 2 .8V5.8l7-1.5v8.9a2.7 2.7 0 1 1-2-2.6c.8 0 1.5.3 2 .8V7.1L8 8.6z"/></svg>{{ else }}<i></i>{{ end }}
              </span>
              <span>{{ .Name }}</span>
            </a>
            {{ end }}
          </div>
        </details>
      {{ else }}
        <a href="{{ .URL }}" {{ if $.IsMenuCurrent "main" . }}aria-current="page"{{ end }}>{{ .Name }}</a>
      {{ end }}
      {{ end }}
    </nav>
    <button class="theme-toggle" type="button" aria-label="切换深色模式" title="切换深色模式">
      <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.66 6.34l1.41-1.41"/></svg>
      <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.6 15.4A9 9 0 0 1 8.6 3.4a9 9 0 1 0 12 12Z"/></svg>
    </button>
  </div>
</header>
