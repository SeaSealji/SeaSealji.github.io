<article class="post-card">
  <div class="post-card-meta">
    {{ with index .Params.categories 0 }}<a class="eyebrow" href="{{ (printf "/categories/%s/" .) | relURL }}">{{ . }}</a>{{ end }}
    <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006.01.02" }}</time>
  </div>
  <h3><a href="{{ .RelPermalink }}">{{ .Title }}</a></h3>
  <p>{{ with .Description }}{{ . }}{{ else }}{{ .Summary | plainify | truncate 110 }}{{ end }}</p>
  <a class="read-more" href="{{ .RelPermalink }}" aria-label="阅读《{{ .Title }}》">阅读全文 <span>→</span></a>
</article>
