{{ define "main" }}
<header class="page-hero music-hero shell">
  <div>
    <p class="kicker">LISTENING ROOM</p>
    <h1>我的音乐角落</h1>
    <p>{{ .Description }}</p>
  </div>
  <div class="music-hero-mark" aria-hidden="true"><span>PLAY</span><strong>♪</strong></div>
</header>
<section class="music-page shell">
  <div class="music-page-heading">
    <div><p class="kicker">REMOTE COLLECTION</p><h2>正在播放</h2></div>
    <p>博客只保存曲目信息，音频通过独立服务器的 HTTPS 地址播放。点击列表按钮查看全部收藏。</p>
  </div>
  {{ partial "music-player.html" . }}
</section>
{{ end }}
